<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Five Letters — Fix My Brainrot</title>
  <meta name="description" content="Solve a five-letter word in six guesses with a simple Wordle-style word activity.">
  <meta name="robots" content="index,follow"><meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://fixmybrainrot.com/wordle">
  <meta property="og:site_name" content="Fix My Brainrot"><meta property="og:type" content="website"><meta property="og:title" content="Five Letters — Fix My Brainrot"><meta property="og:description" content="Solve a five-letter word in six guesses with a simple Wordle-style word activity."><meta property="og:url" content="https://fixmybrainrot.com/wordle">
  <meta name="twitter:card" content="summary"><meta name="twitter:title" content="Five Letters — Fix My Brainrot"><meta name="twitter:description" content="Solve a five-letter word in six guesses with a simple Wordle-style word activity.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-main site-shell activity-layout">
    <div class="activity-top"><a class="back-link" href="/">← Activities</a><p class="activity-description"><span>Find the five-letter word in six guesses.</span><button class="info-button" type="button" data-info-dialog="wordle-info" aria-label="How Five Letters works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 10.5v5.25M12 7.5h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg></button></p></div>
    <section class="panel"><div id="word-grid" class="word-grid" aria-label="Guess grid"></div><div class="word-keyboard" aria-label="On-screen keyboard"><div class="keyboard-row"><button class="keyboard-key" type="button" data-key="q">Q</button><button class="keyboard-key" type="button" data-key="w">W</button><button class="keyboard-key" type="button" data-key="e">E</button><button class="keyboard-key" type="button" data-key="r">R</button><button class="keyboard-key" type="button" data-key="t">T</button><button class="keyboard-key" type="button" data-key="y">Y</button><button class="keyboard-key" type="button" data-key="u">U</button><button class="keyboard-key" type="button" data-key="i">I</button><button class="keyboard-key" type="button" data-key="o">O</button><button class="keyboard-key" type="button" data-key="p">P</button></div><div class="keyboard-row"><button class="keyboard-key" type="button" data-key="a">A</button><button class="keyboard-key" type="button" data-key="s">S</button><button class="keyboard-key" type="button" data-key="d">D</button><button class="keyboard-key" type="button" data-key="f">F</button><button class="keyboard-key" type="button" data-key="g">G</button><button class="keyboard-key" type="button" data-key="h">H</button><button class="keyboard-key" type="button" data-key="j">J</button><button class="keyboard-key" type="button" data-key="k">K</button><button class="keyboard-key" type="button" data-key="l">L</button></div><div class="keyboard-row"><button class="keyboard-key wide" type="button" data-key="enter">Enter</button><button class="keyboard-key" type="button" data-key="z">Z</button><button class="keyboard-key" type="button" data-key="x">X</button><button class="keyboard-key" type="button" data-key="c">C</button><button class="keyboard-key" type="button" data-key="v">V</button><button class="keyboard-key" type="button" data-key="b">B</button><button class="keyboard-key" type="button" data-key="n">N</button><button class="keyboard-key" type="button" data-key="m">M</button><button class="keyboard-key wide" type="button" data-key="backspace">⌫</button></div></div><p id="word-status" class="status" aria-live="polite"></p><button id="word-new" class="secondary" type="button">New word</button></section>
  </main>
  <dialog id="wordle-info" class="info-dialog" aria-labelledby="wordle-info-title"><div class="info-dialog-content"><h2 id="wordle-info-title">How it works</h2><p>Guess the five-letter word in six tries. Green means the letter is correct and in the right place. Yellow means it appears in the word but belongs elsewhere.</p><button class="secondary info-dialog-close" type="button" data-dialog-close>Close</button></div></dialog>
  <script src="js/info-dialog.js"></script><script type="module" src="js/wordle.js"></script>
</body>
</html>
