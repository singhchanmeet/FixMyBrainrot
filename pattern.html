<body>
  <main class="page-main site-shell activity-layout">
    <div class="activity-top"><a class="back-link" href="/">← Activities</a><p class="activity-description"><span>Look carefully, then reconstruct the highlighted cells.</span><button class="info-button" type="button" data-info-dialog="pattern-info" aria-label="How Remember the Pattern works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 10.5v5.25M12 7.5h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg></button></p></div>
    <section class="panel"><div class="controls"><label for="pattern-difficulty"><span class="sr-only">Difficulty</span><select id="pattern-difficulty"><option value="easy">Easy · 4×4</option><option value="medium">Medium · 5×5</option><option value="hard">Hard · 6×6</option></select></label></div><div id="pattern-grid" class="pattern-grid" aria-label="Pattern grid"></div><p id="pattern-status" class="status" aria-live="polite"></p><div class="controls"><button id="pattern-continue" type="button">I’m ready</button><button id="pattern-check" type="button" hidden>Check pattern</button><button id="pattern-new" class="secondary" type="button" hidden>New pattern</button></div></section>
  </main>
  <dialog id="pattern-info" class="info-dialog" aria-labelledby="pattern-info-title"><div class="info-dialog-content"><h2 id="pattern-info-title">How it works</h2><p>Study the highlighted cells. Choose “I’m ready”, then click the cells you remember. Check your pattern when you are finished.</p><button class="secondary info-dialog-close" type="button" data-dialog-close>Close</button></div></dialog>
