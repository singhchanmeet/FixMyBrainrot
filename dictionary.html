<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dictionary — Fix My Brainrot</title>
  <meta name="description" content="Explore a random English word and its meaning in a simple, distraction-free dictionary activity.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://fixmybrainrot.com/dictionary.html">
  <meta property="og:site_name" content="Fix My Brainrot">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dictionary — Fix My Brainrot">
  <meta property="og:description" content="Explore a random English word and its meaning in a simple, distraction-free dictionary activity.">
  <meta property="og:url" content="https://fixmybrainrot.com/dictionary.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Dictionary — Fix My Brainrot">
  <meta name="twitter:description" content="Explore a random English word and its meaning in a simple, distraction-free dictionary activity.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-main site-shell activity-layout">
    <div class="activity-top">
      <a class="back-link" href="index.html">← Activities</a>
      <p class="activity-description"><span>A random word and its short definition.</span><button class="info-button" type="button" data-info-dialog="dictionary-info" aria-label="How Dictionary works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 10.5v5.25M12 7.5h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg></button></p>
    </div>
    <section class="panel">
      <p id="dictionary-word" class="definition-word"></p>
      <p id="dictionary-type" class="definition-type"></p>
      <p id="dictionary-definition" class="intro"></p>
      <p id="dictionary-example" class="definition-example" aria-live="polite"></p>
      <button id="next-word" type="button">Next word</button>
    </section>
  </main>
  <dialog id="dictionary-info" class="info-dialog" aria-labelledby="dictionary-info-title">
    <div class="info-dialog-content">
      <h2 id="dictionary-info-title">How it works</h2>
      <p>Read the word and its meaning. Choose “Next word” whenever you are ready.</p>
      <button class="secondary info-dialog-close" type="button" data-dialog-close>Close</button>
    </div>
  </dialog>
  <script src="js/info-dialog.js"></script>
  <script type="module" src="js/dictionary.js"></script>
</body>
</html>
