<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Unscramble — Fix My Brainrot</title>
  <meta name="description" content="Rearrange the letters to find an English word in a calm, distraction-free activity.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://fixmybrainrot.com/unscramble.html">
  <meta property="og:site_name" content="Fix My Brainrot">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Unscramble — Fix My Brainrot">
  <meta property="og:description" content="Rearrange the letters to find an English word in a calm, distraction-free activity.">
  <meta property="og:url" content="https://fixmybrainrot.com/unscramble.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Unscramble — Fix My Brainrot">
  <meta name="twitter:description" content="Rearrange the letters to find an English word in a calm, distraction-free activity.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-main site-shell activity-layout">
    <div class="activity-top">
      <a class="back-link" href="index.html">← Activities</a>
      <p class="activity-description"><span>Rearrange the letters to find the word.</span><button class="info-button" type="button" data-info-dialog="unscramble-info" aria-label="How Unscramble works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 10.5v5.25M12 7.5h.01" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg></button></p>
    </div>
    <section class="panel unscramble-panel">
      <div class="anagram-settings">
        <label>
          <span class="sr-only">Difficulty</span>
          <select id="anagram-difficulty" aria-label="Difficulty">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </div>
      <div id="letter-bank" class="anagram-letter-bank" role="group" aria-label="Scrambled letters"></div>
      <div id="answer-slots" class="anagram-answer" aria-live="polite" aria-label="Your answer"></div>
      <div class="anagram-controls">
        <button id="clear-answer" class="secondary" type="button">Clear</button>
        <button id="backspace-answer" class="secondary" type="button">Backspace</button>
        <button id="new-anagram" class="secondary" type="button">New word</button>
      </div>
      <p id="anagram-status" class="status" role="status"></p>
    </section>
  </main>
  <dialog id="unscramble-info" class="info-dialog" aria-labelledby="unscramble-info-title">
    <div class="info-dialog-content">
      <h2 id="unscramble-info-title">How it works</h2>
      <p>Use every letter once to find the word. You can tap the letters or use your physical keyboard.</p>
      <button class="secondary info-dialog-close" type="button" data-dialog-close>Close</button>
    </div>
  </dialog>
  <script src="js/info-dialog.js"></script>
  <script type="module" src="js/unscramble.js"></script>
</body>
</html>
